<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B6B5B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Predicación">
<title>Predicación · Congregación</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3EE;--card:#FFFFFF;--ink:#17201C;--soft:#5E6862;--line:#E6E8E1;--fill:#ECEEE8;--brand:#1B6B5B;--brand-bg:#DCEFE9;--on:#fff;--bad:#B33A2E;--bad-bg:#F9E6E2;--gold:#A87B2E;--gold-bg:#F4E8CC;--ok:#2E9E6B;--nav:62px;--r:22px;--sh:0 1px 2px rgba(20,30,25,.05),0 8px 24px -10px rgba(20,30,25,.14);--serif:'Fraunces',Georgia,serif;--ease:cubic-bezier(.3,1.4,.5,1)}
@media(prefers-color-scheme:dark){:root{--bg:#0E1210;--card:#171C19;--ink:#EAEDEA;--soft:#A5AFA8;--line:#272E29;--fill:#212824;--brand:#4BB89F;--brand-bg:#1C302B;--on:#0A1411;--bad:#E17A6E;--bad-bg:#382320;--gold:#D0A44E;--gold-bg:#372C14;--ok:#58C98F;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.5)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;position:relative}
.view{display:none;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:calc(20px + env(safe-area-inset-top)) 16px 28px}
.view.on{display:block;animation:in .28s ease-out}
.view.full{padding:0;overflow:hidden}.view.full.on{display:flex;flex-direction:column}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font:600 32px/1.1 var(--serif);letter-spacing:-.02em;margin:12px 0 4px;text-transform:capitalize}
h2{font:600 18px/1.25 var(--serif);margin:0 0 10px}
.sub{color:var(--soft);margin:0 0 18px;font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
/* estado */
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 13px 6px 11px;border-radius:99px;font-weight:600;font-size:13px;background:var(--fill);color:var(--soft)}
.status::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor}
.status.live{background:var(--brand-bg);color:var(--ok)}.status.live::before{animation:pulse 1.6s infinite}
.status.soon{background:var(--gold-bg);color:var(--gold)}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 9px transparent}}
.hora{background:linear-gradient(135deg,var(--brand),color-mix(in srgb,var(--brand) 70%,#000));color:var(--on);display:flex;align-items:center;justify-content:space-between;gap:12px}
.hora small{display:block;font-size:12.5px;font-weight:500;opacity:.8}
.hora b{font:600 44px/1.05 var(--serif);letter-spacing:-.02em}
.hora .pill{background:rgba(255,255,255,.2);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.dl>div{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line)}.dl>div:last-child{border:0;padding-bottom:0}.dl>div:first-child{padding-top:0}
.ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--brand-bg);color:var(--brand);display:grid;place-items:center}
.dl small{display:block;font-size:12.5px;color:var(--soft)}
.dl b{font-weight:600;font-size:16px}.dl .d{display:block;color:var(--soft);font-size:13px}
.go{display:flex;gap:8px;margin-top:10px}.go[hidden]{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--brand-bg);color:var(--brand);font:600 13px Inter,sans-serif;padding:8px 13px;border-radius:99px;cursor:pointer;text-decoration:none;transition:transform .15s}
.chip:active{transform:scale(.94)}.chip .i{width:16px;height:16px}
.st{font-size:12.5px;color:var(--soft);margin:12px 0 0}
details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--brand);margin-top:14px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--soft);margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--fill);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);background:var(--card);box-shadow:0 0 0 4px var(--brand-bg)}
textarea{resize:vertical;min-height:70px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;color:var(--soft);font:600 14px Inter,sans-serif;padding:9px 6px;border-radius:11px;cursor:pointer;transition:.2s}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,.14)}
.btn{width:100%;margin-top:18px;border:0;border-radius:16px;background:var(--brand);color:var(--on);font:600 16px Inter,sans-serif;padding:15px;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--bad);margin-top:4px;padding:12px;font-size:14px}
.mini{border:0;background:var(--bad-bg);color:var(--bad);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;flex:none}
.mini .i{width:16px;height:16px}
.bar{display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--card);box-shadow:0 1px 0 var(--line)}
.bar .seg{flex:1}.bar a{flex:none;font-size:13px;font-weight:600;color:var(--brand);text-decoration:none;padding:8px}
.frame{flex:1;min-height:0;position:relative}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.frame .ld{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--soft);font-size:14px;pointer-events:none}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.kp div{background:var(--card);border-radius:18px;padding:13px;box-shadow:var(--sh)}
.kp b{display:block;font:600 28px/1.1 var(--serif);color:var(--bad)}.kp span{font-size:12px;color:var(--soft)}
.row{display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:13px;margin:8px 0}
.row i{height:9px;border-radius:99px;background:var(--fill);overflow:hidden}.row u{display:block;height:100%;background:var(--bad);border-radius:99px}.row span:last-child{text-align:right;font-weight:600}
.item{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.item:last-child{border:0}
.item b{font-weight:600}.item small{display:block;color:var(--soft);font-size:12.5px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;margin-left:6px;vertical-align:middle}
.tag.h{background:var(--gold-bg);color:var(--gold)}.tag.c{background:var(--bad-bg);color:var(--bad)}
.empty{color:var(--soft);text-align:center;padding:26px 8px;font-size:14px}
.sb{position:relative}.sb .i{position:absolute;left:13px;top:13px;color:var(--soft);pointer-events:none}.sb input{padding-left:42px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.fr>div label{margin-top:0}
.exp{display:flex;gap:8px;flex-wrap:wrap}
.exp .chip{flex:1;justify-content:center;white-space:nowrap}.exp .chip.wa{background:#25D366;color:#06311a}
/* nav */
nav{flex:none;position:relative;display:grid;grid-template-columns:repeat(3,1fr);height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px);border-top:1px solid var(--line)}
nav button{border:0;background:none;color:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 11px Inter,sans-serif;cursor:pointer;position:relative;z-index:1;transition:color .2s,transform .15s}
nav button:active{transform:scale(.9)}
nav button.on{color:var(--brand)}nav button.on .i{animation:pop .45s var(--ease)}
nav .ind{position:absolute;top:7px;left:0;width:33.333%;height:calc(var(--nav) - 14px);display:grid;place-items:center;transition:transform .35s var(--ease);pointer-events:none}
nav .ind::after{content:'';width:68px;height:100%;border-radius:18px;background:var(--brand-bg)}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
#net{display:none;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:calc(7px + env(safe-area-inset-top)) 12px 7px}
body.off #net{display:flex}body.off .view:not(.full){padding-top:20px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:99px;font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:9;box-shadow:var(--sh)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.app{box-shadow:0 0 0 1px var(--line)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 016.5 2H20v15H6.5A2.5 2.5 0 004 19.5z"/><path d="M4 19.5A2.5 2.5 0 006.5 22H20v-5"/></symbol>
<symbol id="i-nav" viewBox="0 0 24 24"><path d="M3 11l18-8-8 18-2-8z"/></symbol>

<div class="app">
<div id="net" role="status"><svg class="i"><use href="#i-off"/></svg>Sin conexión · mostrando datos guardados</div>

<!-- ===== 1 · INICIO ===== -->
<section class="view on" id="v-inicio">
 <span class="status" id="estado">…</span>
 <h1 id="fecha"></h1>
 <p class="sub" id="sem"></p>

 <div class="card hora"><div><small>Hora de salida</small><b id="hora"></b></div><span class="pill" id="turno"></span></div>

 <div class="card">
  <div class="dl">
   <div><span class="ic"><svg class="i"><use href="#i-nav"/></svg></span><div><small>Capitán</small><b id="cap">—</b></div></div>
   <div><span class="ic"><svg class="i"><use href="#i-home"/></svg></span><div><small>Casa de salida</small><b id="casa">—</b><span class="d" id="dir"></span>
     <div class="go" id="go" hidden>
      <a class="chip" id="gmaps" target="_blank" rel="noopener"><svg class="i"><use href="#i-nav"/></svg>Google Maps</a>
      <a class="chip" id="waze" target="_blank" rel="noopener"><svg class="i"><use href="#i-nav"/></svg>Waze</a>
     </div></div></div>
   <div><span class="ic"><svg class="i"><use href="#i-map"/></svg></span><div><small>Territorio</small><b id="terr">—</b></div></div>
  </div>
  <p class="st" id="src"></p>
  <details><summary>Completar datos de hoy manualmente</summary>
   <label for="m_cap">Capitán</label><input id="m_cap" placeholder="Nombre">
   <label for="m_casa">Casa de salida</label><input id="m_casa" placeholder="Familia">
   <label for="m_dir">Dirección</label><input id="m_dir" placeholder="Calle, número, comuna">
   <label for="m_terr">Territorio</label><input id="m_terr" placeholder="N.º">
   <button class="btn" id="m_save" type="button" style="margin-top:14px">Guardar datos de hoy</button>
  </details>
 </div>

 <div class="card">
  <h2>Reportar inasistencia</h2>
  <form id="frm" autocomplete="off">
   <div class="seg" id="tipo"><button type="button" class="on" data-v="Hermano">Hermano</button><button type="button" data-v="Capitán">Capitán</button></div>
   <label for="nom">Nombre</label><input id="nom" required placeholder="Nombre del hermano">
   <label for="fec">Fecha</label><input id="fec" type="date" required>
   <label for="mot">Motivo</label>
   <select id="mot"><option>Salud</option><option>Trabajo</option><option>Familia</option><option>Sin aviso</option><option>Otro</option></select>
   <label for="nota">Nota (opcional)</label><textarea id="nota" placeholder="Detalles…"></textarea>
   <button class="btn" type="submit">Registrar inasistencia</button>
  </form>
 </div>
</section>

<!-- ===== 2 · PREDICACIÓN ===== -->
<section class="view full" id="v-pred">
 <div class="bar"><div class="seg" id="psub"><button class="on" data-s="prog">Programa</button><button data-s="ina">Inasistencias</button></div><a id="pext" href="https://benavitrex.github.io/Predicaci-n-Automatica/programa.html" target="_blank" rel="noopener">Abrir ↗</a></div>
 <div class="frame" id="p-prog"><div class="ld">Cargando programa…</div><iframe title="Programa de predicación" data-src="https://benavitrex.github.io/Predicaci-n-Automatica/programa.html" loading="lazy"></iframe></div>
 <div id="p-ina" style="display:none;flex:1;min-height:0;overflow-y:auto;padding:16px 16px 28px">
  <div class="card" style="padding:14px">
   <div class="sb"><svg class="i"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre"></div>
   <div class="fr">
    <div><label for="fd">Desde</label><input id="fd" type="date"></div>
    <div><label for="fr">Rol</label><select id="fr"><option value="">Todos</option><option>Hermano</option><option>Capitán</option></select></div>
   </div>
  </div>
  <div id="ina-out"></div>
 </div>
</section>

<!-- ===== 3 · VIDA Y MINISTERIO ===== -->
<section class="view full" id="v-vym">
 <div class="frame"><div class="ld">Cargando…</div><iframe title="Vida y Ministerio" data-src="https://jorgelondres37.github.io/Vida-y-Ministerio/programa.html"></iframe></div>
</section>

<nav aria-label="Secciones">
 <span class="ind" id="ind"></span>
 <button class="on" data-t="inicio"><svg class="i"><use href="#i-home"/></svg>Inicio</button>
 <button data-t="pred"><svg class="i"><use href="#i-cal"/></svg>Predicación</button>
 <button data-t="vym"><svg class="i"><use href="#i-book"/></svg>Vida y Ministerio</button>
</nav>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BASE='https://benavitrex.github.io/Predicaci-n-Automatica/';
const KEY='inasistencias_v1',TABS=['inicio','pred','vym'];
const iso=d=>d.toLocaleDateString('sv');
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('No se pudo guardar en este navegador');return false}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2400);}

/* ---------- Conexión ---------- */
function net(){document.body.classList.toggle('off',!navigator.onLine);$$('.ld').forEach(l=>{if(!navigator.onLine)l.textContent='Sin conexión. Este contenido necesita internet.'});}
addEventListener('online',()=>{net();loadToday();toast('Conexión restablecida')});addEventListener('offline',()=>{net();toast('Sin conexión')});
net();

/* ---------- Pestañas ---------- */
function tab(t){
  $$('.view').forEach(v=>v.classList.toggle('on',v.id=='v-'+t));
  $$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  $('#ind').style.transform='translateX('+TABS.indexOf(t)*100+'%)';
  $$('#v-'+t+' iframe').forEach(f=>{ if(!f.src&&f.dataset.src&&navigator.onLine){f.src=f.dataset.src;f.addEventListener('load',()=>f.parentNode.querySelector('.ld')?.remove(),{once:true});} });
  if(t=='pred')renderInas();
  navigator.vibrate?.(8);
  try{history.replaceState(null,'','#'+t)}catch{}
}
$$('nav button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
$('#psub').onclick=e=>{const s=e.target.dataset.s;if(!s)return;
  $$('#psub button').forEach(b=>b.classList.toggle('on',b.dataset.s==s));
  $('#p-prog').style.display=s=='prog'?'':'none';$('#p-ina').style.display=s=='ina'?'block':'none';
  $('#pext').style.visibility=s=='prog'?'visible':'hidden';
  if(s=='ina')renderInas();};

/* ---------- Inicio ---------- */
const hoy=new Date(),HOY=iso(hoy),dow=hoy.getDay(),finde=dow==0||dow==6;
const SAL=finde?[10,30]:[10,0],DUR=2; // salida y duración estimada (horas)
$('#fecha').textContent=hoy.toLocaleDateString('es-CL',{weekday:'long',day:'numeric',month:'long'});
$('#sem').textContent=hoy.getFullYear()+' · '+(finde?'Fin de semana':'Entre semana');
$('#hora').textContent=finde?'10:30 AM':'10:00 AM';
$('#turno').textContent=finde?'Sáb–Dom':'Lun–Vie';
$('#fec').value=HOY;

function estado(){
  const n=new Date(),ini=new Date(n.getFullYear(),n.getMonth(),n.getDate(),...SAL),fin=new Date(+ini+DUR*36e5),e=$('#estado');
  if(n<ini){const m=Math.ceil((ini-n)/6e4),h=Math.floor(m/60),mm=m%60;
    e.className='status soon';e.textContent='Próxima salida en '+(h?h+' h':'')+(h&&mm?' ':'')+(mm?mm+' min':'');}
  else if(n<fin){e.className='status live';e.textContent='En curso';}
  else{e.className='status';e.textContent='Salida finalizada hoy';}
}
estado();setInterval(estado,3e4);

function showToday(d,src){
  $('#cap').textContent=d.cap||'—';$('#casa').textContent=d.casa||'—';
  $('#dir').textContent=d.dir||'';$('#terr').textContent=d.terr?('Territorio '+d.terr):'—';
  $('#src').textContent=src;
  const lugar=(d.dir||d.casa||'').trim(),q=encodeURIComponent(lugar);
  $('#go').hidden=!lugar;
  $('#gmaps').href='https://www.google.com/maps/dir/?api=1&destination='+q;
  $('#waze').href='https://waze.com/ul?q='+q+'&navigate=yes';
}
const manual=()=>load('hoy:'+HOY,null);
async function loadToday(){
  const m=manual(),c=load('cache:hoy',null);
  if(m)showToday(m,'Datos ingresados manualmente.');
  else if(c?.f==HOY)showToday(c.d,'Datos guardados del programa'+(navigator.onLine?'. Actualizando…':' · sin conexión.'));
  else showToday({},'Sin datos para hoy todavía.');
  if(!navigator.onLine)return;
  try{
    const r=await fetch(BASE+'data.json?'+Date.now());if(!r.ok)throw 0;
    const j=await r.json(),rows=(j.historial?.[HOY.slice(0,7)]?.rows||[]).filter(x=>x.f==HOY).sort((a,b)=>String(a.hora).localeCompare(String(b.hora)));
    const x=rows[0];
    if(x){const d={cap:x.hn,casa:x.cn,dir:x.dir,terr:x.terr};store('cache:hoy',{f:HOY,d});
      if(!m)showToday(d,'Leído del programa de predicación'+(rows.length>1?' · hay '+rows.length+' salidas hoy; se muestra la primera.':'.'));}
    else if(!m)$('#src').textContent='El programa no tiene salida registrada para hoy. Puedes completarla manualmente.';
  }catch{ if(!m&&!(c?.f==HOY))$('#src').textContent='No se pudo leer el programa. Completa los datos manualmente o míralo en la pestaña Predicación.'; }
}
$('#m_save').onclick=()=>{
  const d={cap:$('#m_cap').value.trim(),casa:$('#m_casa').value.trim(),dir:$('#m_dir').value.trim(),terr:$('#m_terr').value.trim()};
  if(!d.cap&&!d.casa&&!d.dir&&!d.terr)return toast('Escribe al menos un dato');
  Object.keys(localStorage).filter(k=>k.startsWith('hoy:')&&k!='hoy:'+HOY).forEach(k=>localStorage.removeItem(k));
  if(store('hoy:'+HOY,d)){showToday(d,'Datos ingresados manualmente.');toast('Datos de hoy guardados');}
};
const m0=manual();if(m0){$('#m_cap').value=m0.cap||'';$('#m_casa').value=m0.casa||'';$('#m_dir').value=m0.dir||'';$('#m_terr').value=m0.terr||'';}
loadToday();

/* ---------- Reportes ---------- */
let TIPO='Hermano';
$('#tipo').onclick=e=>{const v=e.target.dataset.v;if(!v)return;TIPO=v;
  $$('#tipo button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
  $('#nom').placeholder='Nombre del '+(v=='Capitán'?'capitán':'hermano');};
$('#frm').onsubmit=e=>{
  e.preventDefault();
  const nombre=$('#nom').value.trim();if(!nombre)return;
  const list=load(KEY,[]);
  list.push({id:Date.now().toString(36),tipo:TIPO,nombre,fecha:$('#fec').value,motivo:$('#mot').value,nota:$('#nota').value.trim(),creado:new Date().toISOString()});
  if(store(KEY,list)){$('#nom').value='';$('#nota').value='';toast('Inasistencia registrada ✓');}
};

const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const fmtD=f=>new Date(f+'T00:00').toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const cnt=(L,f)=>{const o={};L.forEach(x=>{const k=f(x);o[k]=(o[k]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1]);};
let VIEW=[];
function filtrar(){
  const q=norm($('#q').value.trim()),fd=$('#fd').value,fr=$('#fr').value;
  return load(KEY,[]).filter(x=>(!q||norm(x.nombre).includes(q))&&(!fd||x.fecha>=fd)&&(!fr||x.tipo==fr))
    .sort((a,b)=>b.fecha.localeCompare(a.fecha)||b.creado.localeCompare(a.creado));
}
function renderInas(){
  const L=VIEW=filtrar(),box=$('#ina-out'),total=load(KEY,[]).length;
  if(!L.length){box.innerHTML='<div class="empty">'+(total?'Ningún registro coincide con el filtro.':'Aún no hay inasistencias registradas.<br>Repórtalas desde la pestaña Inicio.')+'</div>';return;}
  const mes=HOY.slice(0,7),nMes=L.filter(x=>x.fecha.startsWith(mes)).length,nCap=L.filter(x=>x.tipo=='Capitán').length;
  const mot=cnt(L,x=>x.motivo),nom=cnt(L,x=>x.nombre).slice(0,5),mx=mot[0][1];
  box.innerHTML=`<div class="kp"><div><b>${L.length}</b><span>Total</span></div><div><b>${nMes}</b><span>Este mes</span></div><div><b>${nCap}</b><span>Capitanes</span></div></div>
  <div class="card"><h2>Exportar</h2><div class="exp">
   <button class="chip wa" data-x="wa"><svg class="i"><use href="#i-share"/></svg>WhatsApp</button>
   <button class="chip" data-x="txt"><svg class="i"><use href="#i-copy"/></svg>Copiar texto</button>
   <button class="chip" data-x="json"><svg class="i"><use href="#i-code"/></svg>JSON</button></div></div>
  <div class="card"><h2>Por motivo</h2>${mot.map(([k,n])=>`<div class="row"><span>${esc(k)}</span><i><u style="width:${n/mx*100}%"></u></i><span>${n}</span></div>`).join('')}</div>
  <div class="card"><h2>Más inasistencias</h2>${nom.map(([k,n])=>`<div class="row" style="grid-template-columns:1fr 28px"><span>${esc(k)}</span><span style="text-align:right;font-weight:600">${n}</span></div>`).join('')}</div>
  <div class="card"><h2>Registro (${L.length})</h2>${L.map(x=>`<div class="item"><div><b>${esc(x.nombre)}</b><span class="tag ${x.tipo=='Capitán'?'c':'h'}">${esc(x.tipo)}</span><small>${fmtD(x.fecha)} · ${esc(x.motivo)}</small>${x.nota?`<small>${esc(x.nota)}</small>`:''}</div><button class="mini" data-del="${x.id}" aria-label="Eliminar"><svg class="i"><use href="#i-trash"/></svg></button></div>`).join('')}</div>
  <button class="btn ghost" id="clr">Borrar todo el registro</button>`;
}
['q','fd','fr'].forEach(id=>$('#'+id).addEventListener('input',renderInas));

/* ---------- Exportar ---------- */
function resumen(){
  const L=VIEW,d=x=>x.fecha.split('-').reverse().slice(0,2).join('/');
  return `📋 *Inasistencias · Predicación*\nTotal: ${L.length}\n\n*Por motivo*\n${cnt(L,x=>x.motivo).map(([k,n])=>`• ${k}: ${n}`).join('\n')}\n\n*Detalle*\n${L.map(x=>`• ${d(x)} · ${x.nombre} (${x.tipo}) · ${x.motivo}${x.nota?' — '+x.nota:''}`).join('\n')}`;
}
async function copiar(t){try{await navigator.clipboard.writeText(t);toast('Copiado ✓')}catch{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();toast('Copiado ✓')}}
function exportar(k){
  if(!VIEW.length)return;
  if(k=='wa')return window.open('https://wa.me/?text='+encodeURIComponent(resumen()),'_blank');
  if(k=='txt')return copiar(resumen());
  const json=JSON.stringify({generado:new Date().toISOString(),total:VIEW.length,porMotivo:Object.fromEntries(cnt(VIEW,x=>x.motivo)),registros:VIEW.map(({id,creado,...r})=>r)},null,2);
  if(navigator.canShare?.({files:[new File([json],'inasistencias.json',{type:'application/json'})]})){
    navigator.share({files:[new File([json],'inasistencias.json',{type:'application/json'})]}).catch(()=>{});
  }else copiar(json).then?.(()=>{});
}
$('#ina-out').onclick=e=>{
  const del=e.target.closest('[data-del]'),x=e.target.closest('[data-x]');
  if(del){store(KEY,load(KEY,[]).filter(r=>r.id!=del.dataset.del));renderInas();}
  if(x)exportar(x.dataset.x);
  if(e.target.id=='clr'&&confirm('¿Borrar todas las inasistencias registradas?')){store(KEY,[]);renderInas();}
};

/* ---------- PWA ---------- */
(function(){
  const icon=s=>{const c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');
    x.fillStyle='#1B6B5B';x.fillRect(0,0,s,s);x.fillStyle='#fff';x.font='600 '+s*.56+'px Georgia,serif';x.textAlign='center';x.textBaseline='middle';x.fillText('P',s/2,s*.54);return c.toDataURL('image/png')};
  try{
    const url=location.href.split('#')[0].split('?')[0],i192=icon(192),i512=icon(512);
    const man={name:'Predicación · Congregación',short_name:'Predicación',start_url:url,scope:new URL('./',url).href,display:'standalone',orientation:'portrait',background_color:'#1B6B5B',theme_color:'#1B6B5B',lang:'es',
      icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
    const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.append(l);
    const a=document.createElement('link');a.rel='apple-touch-icon';a.href=icon(180);document.head.append(a);
  }catch{}
  // El Service Worker debe ser un archivo propio (sw.js) junto a este HTML
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

const h=location.hash.slice(1);if(['pred','vym'].includes(h))tab(h);
</script>
</body></html>
